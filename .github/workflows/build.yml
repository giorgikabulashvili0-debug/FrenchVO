name: Build Expressive Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Package APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FrenchVO_Expressif_V3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FrenchVO-Expressif-V3
          path: FrenchVO_Expressif_V3.apk
          if-no-files-found: error
          retention-days: 30
